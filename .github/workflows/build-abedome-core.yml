name: Build ABEDOME Core
run-name: "ABEDOME Core: ${{ github.ref_name }}"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - abedome/develop
    paths:
      - ".github/workflows/build-abedome-core.yml"
      - ".github/workflows/publish-abedome-core.yml"
      - "Dockerfile"
      - "homeassistant/brand.py"
      - "homeassistant/components/analytics/**"
      - "homeassistant/components/backup/**"
      - "homeassistant/components/cloud/**"
      - "homeassistant/components/frontend/**"
      - "homeassistant/components/hassio/**"
      - "homeassistant/components/labs/**"
      - "homeassistant/components/onboarding/**"
      - "homeassistant/generated/labs.py"
      - "homeassistant/package_constraints.txt"
      - "requirements.txt"
      - "requirements_all.txt"
      - "script/abedome/**"
      - "script/hassfest/mdi_icons.py"
      - "tests/scripts/abedome/**"
      - "tests/test_brand.py"
      - "tests/components/analytics/**"
      - "tests/components/backup/**"
      - "tests/components/cloud/**"
      - "tests/components/frontend/**"
      - "tests/components/hassio/**"
      - "tests/components/labs/**"
      - "tests/components/onboarding/**"
      - "pyproject.toml"
      - ".python-version"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CORE_VERSION: "2026.11.1"
  FRONTEND_VERSION: "20261028.5"
  FRONTEND_URL: >-
    https://github.com/Mauro2020/abedome-frontend/releases/download/abedome-frontend-20261028.5/abedome_frontend-20261028.5-py3-none-any.whl
  FRONTEND_SHA256: ${{ vars.ABEDOME_FRONTEND_20261028_5_SHA256 }}
  UPSTREAM_TRANSLATIONS_SHA256: ebe44a05170a170f627cad8a982a81b309519ff301e85f871cc91623e9ce7906
  UPSTREAM_TRANSLATIONS_URL: >-
    https://files.pythonhosted.org/packages/6d/dc/40a9d11b402c9b5d6d07db767c855c41dba976a50655d04b60d7037486ab/homeassistant-2026.11.1-py3-none-any.whl

jobs:
  build:
    name: Package and verify ABEDOME Core
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: Check out ABEDOME Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          check-latest: true

      - name: Require the released Frontend digest
        shell: bash
        run: |
          if [[ ! "$FRONTEND_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set repository variable ABEDOME_FRONTEND_20261028_5_SHA256 to the released Frontend wheel SHA-256"
            exit 1
          fi

      - name: Install build and test tools
        run: |
          python -m pip install --upgrade pip build orjson==3.13.0
          python -m pip install \
            --editable . \
            --editable packages/pytest-homeassistant

      - name: Validate the pinned Frontend dependency
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())
          dependency = next(
              requirement
              for requirement in project["project"]["dependencies"]
              if requirement.startswith("abedome-frontend @ ")
          )
          expected = (
              f"abedome-frontend @ {os.environ['FRONTEND_URL']}"
              f"#sha256={os.environ['FRONTEND_SHA256']}"
          )
          assert dependency == expected
          PY

      - name: Prepare pinned backend translations
        run: |
          set -euo pipefail
          translation_wheel="${RUNNER_TEMP}/homeassistant-${CORE_VERSION}-py3-none-any.whl"
          curl --fail --location --retry 3 \
            --output "$translation_wheel" \
            "$UPSTREAM_TRANSLATIONS_URL"
          python script/abedome/import_backend_translations.py import \
            --wheel "$translation_wheel" \
            --expected-sha256 "$UPSTREAM_TRANSLATIONS_SHA256" \
            --require-language it
          python -m script.translations develop --all
          python script/abedome/import_backend_translations.py \
            verify --language en --language it

      - name: Test the Core publication contract
        run: >-
          python -m pytest -q --confcutdir=tests/scripts/abedome
          tests/scripts/abedome/test_check_ghcr_tag.py
          tests/scripts/abedome/test_import_backend_translations.py
          tests/scripts/abedome/test_publish_contract.py

      - name: Verify the published ABEDOME Frontend
        run: |
          set -euo pipefail
          frontend_wheel="${RUNNER_TEMP}/abedome_frontend-${FRONTEND_VERSION}-py3-none-any.whl"
          curl --fail --location --retry 3 --output "$frontend_wheel" "$FRONTEND_URL"
          echo "$FRONTEND_SHA256  $frontend_wheel" | sha256sum --check
          python -m pip install --no-deps "$frontend_wheel"
          python - <<'PY'
          import os
          from importlib.metadata import version

          import hass_frontend

          assert hass_frontend.where().is_dir()
          assert version("abedome-frontend") == os.environ["FRONTEND_VERSION"]
          PY

      - name: Compile the Core source
        run: python -m compileall -q homeassistant

      - name: Verify ABEDOME distribution identity
        run: |
          python - <<'PY'
          from homeassistant.brand import (
              CLI_DESCRIPTION,
              DISTRIBUTION_DISPLAY_NAME,
              DISTRIBUTION_NAME,
              FORK_NOTICE,
              UPSTREAM_PROJECT_NAME,
              UPSTREAM_NAME_USAGE_NOTICE,
          )

          assert DISTRIBUTION_DISPLAY_NAME == "ABEDOME"
          assert DISTRIBUTION_NAME == "ABEDOME OS"
          assert UPSTREAM_PROJECT_NAME == "Home Assistant"
          assert CLI_DESCRIPTION == "ABEDOME OS"
          assert "not affiliated" in FORK_NOTICE
          assert UPSTREAM_NAME_USAGE_NOTICE.startswith('"Home Assistant"')
          PY

      - name: Build Core distribution archives
        run: python -m build

      - name: Verify Core distribution translations
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          required = {
              "homeassistant/components/onboarding/translations/en.json",
              "homeassistant/components/onboarding/translations/it.json",
          }
          wheel = next(Path("dist").glob("*.whl"))
          source = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_members = set(archive.namelist())
          with tarfile.open(source, "r:gz") as archive:
              source_members = {member.name for member in archive.getmembers()}
          assert required <= wheel_members
          assert all(
              any(member.endswith(f"/{required_file}") for member in source_members)
              for required_file in required
          )
          PY

      - name: Retain the Core distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: abedome-core-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 7
