name: Build ABEDOME Core
run-name: "ABEDOME Core: ${{ github.ref_name }}"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - abedome/develop
    paths:
      - ".github/workflows/build-abedome-core.yml"
      - ".github/workflows/publish-abedome-core.yml"
      - "Dockerfile"
      - "homeassistant/const.py"
      - "homeassistant/brand.py"
      - "homeassistant/__main__.py"
      - "homeassistant/components/frontend/**"
      - "homeassistant/package_constraints.txt"
      - "requirements.txt"
      - "requirements_all.txt"
      - "script/abedome/check_ghcr_tag.py"
      - "script/hassfest/mdi_icons.py"
      - "tests/scripts/abedome/test_check_ghcr_tag.py"
      - "tests/scripts/abedome/test_publish_contract.py"
      - "tests/test_brand.py"
      - "tests/components/frontend/**"
      - "pyproject.toml"
      - ".python-version"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package and verify the ABEDOME core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out ABEDOME Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the supported Python version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          check-latest: true

      - name: Install build and test tools
        run: python -m pip install --upgrade pip build pytest

      - name: Test the Core publication contract
        run: >-
          python -m pytest -q --confcutdir=tests/scripts/abedome
          tests/scripts/abedome/test_check_ghcr_tag.py
          tests/scripts/abedome/test_publish_contract.py

      - name: Verify the published ABEDOME Frontend
        env:
          FRONTEND_SHA256: e13411e71544c9ff7c5b8beca4b7368ee96b0390842e3e26e221874f91f38d0e
          FRONTEND_URL: https://github.com/Mauro2020/abedome-frontend/releases/download/abedome-frontend-2026.8.5.dev4/abedome_frontend-2026.8.5.dev4-py3-none-any.whl
          FRONTEND_VERSION: 2026.8.5.dev4
        run: |
          curl --fail --location --retry 3 --output /tmp/abedome_frontend-2026.8.5.dev4-py3-none-any.whl "$FRONTEND_URL"
          echo "$FRONTEND_SHA256  /tmp/abedome_frontend-2026.8.5.dev4-py3-none-any.whl" | sha256sum --check
          python -m pip install --no-deps /tmp/abedome_frontend-2026.8.5.dev4-py3-none-any.whl
          python - <<'PY'
          import os
          from importlib.metadata import version

          import hass_frontend

          assert hass_frontend.where().is_dir()
          assert version("abedome-frontend") == os.environ["FRONTEND_VERSION"]
          PY

      - name: Compile the core source
        run: python -m compileall -q homeassistant

      - name: Verify ABEDOME distribution identity
        run: |
          python - <<'PY'
          from homeassistant.brand import (
              CLI_DESCRIPTION,
              DISTRIBUTION_DISPLAY_NAME,
              DISTRIBUTION_NAME,
              FORK_NOTICE,
              UPSTREAM_PROJECT_NAME,
              UPSTREAM_NAME_USAGE_NOTICE,
          )

          assert DISTRIBUTION_DISPLAY_NAME == "ABEDOME"
          assert DISTRIBUTION_NAME == "ABEDOME OS"
          assert UPSTREAM_PROJECT_NAME == "Home Assistant"
          assert CLI_DESCRIPTION == "ABEDOME OS"
          assert "not affiliated" in FORK_NOTICE
          assert UPSTREAM_NAME_USAGE_NOTICE.startswith('"Home Assistant"')
          PY

      - name: Build Core distribution archives
        run: python -m build

      - name: Retain the Core distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abedome-core-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 7
