name: Build ABEDOME Core
run-name: "ABEDOME Core: ${{ github.ref_name }}"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  pull_request:
    branches:
      - abedome/develop
    paths:
      - ".github/workflows/build-abedome-core.yml"
      - ".github/workflows/publish-abedome-core.yml"
      - "Dockerfile"
      - "homeassistant/const.py"
      - "homeassistant/brand.py"
      - "homeassistant/__main__.py"
      - "homeassistant/components/frontend/**"
      - "homeassistant/components/onboarding/**"
      - "homeassistant/package_constraints.txt"
      - "requirements.txt"
      - "requirements_all.txt"
      - "script/abedome/check_ghcr_tag.py"
      - "script/abedome/import_backend_translations.py"
      - "script/hassfest/mdi_icons.py"
      - "tests/scripts/abedome/test_check_ghcr_tag.py"
      - "tests/scripts/abedome/test_import_backend_translations.py"
      - "tests/scripts/abedome/test_publish_contract.py"
      - "tests/test_brand.py"
      - "tests/components/frontend/**"
      - "tests/components/onboarding/**"
      - "pyproject.toml"
      - ".python-version"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Package and verify the ABEDOME core
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out ABEDOME Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the supported Python version
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          check-latest: true

      - name: Install build and test tools
        run: python -m pip install --upgrade pip build pytest orjson==3.11.9

      - name: Prepare pinned backend translations
        env:
          UPSTREAM_TRANSLATIONS_SHA256: 35005ce5491f64e48dfa0ca8436751474b8d8ec346a2406c2e2ba0f40427afcd
          UPSTREAM_TRANSLATIONS_URL: https://files.pythonhosted.org/packages/f9/77/1fa0722a0b8417069844a067a2d16aeaa28b2894f462b37553e421f29bfd/homeassistant-2026.8.1-py3-none-any.whl
        run: |
          set -euo pipefail
          translation_wheel="${RUNNER_TEMP}/homeassistant-2026.8.1-py3-none-any.whl"
          curl --fail --location --retry 3 \
            --output "$translation_wheel" \
            "$UPSTREAM_TRANSLATIONS_URL"
          python script/abedome/import_backend_translations.py import \
            --wheel "$translation_wheel" \
            --expected-sha256 "$UPSTREAM_TRANSLATIONS_SHA256" \
            --require-language it
          python -m script.translations develop --all
          python script/abedome/import_backend_translations.py \
            verify --language en --language it

      - name: Test the Core publication contract
        run: >-
          python -m pytest -q --confcutdir=tests/scripts/abedome
          tests/scripts/abedome/test_check_ghcr_tag.py
          tests/scripts/abedome/test_import_backend_translations.py
          tests/scripts/abedome/test_publish_contract.py

      - name: Verify the published ABEDOME Frontend
        env:
          FRONTEND_SHA256: 886fabc0e7d924ce8a7f46a1dd3d624b707a9a17cd21934dc10736945cebd547
          FRONTEND_URL: https://github.com/Mauro2020/abedome-frontend/releases/download/abedome-frontend-2026.8.5.dev7/abedome_frontend-2026.8.5.dev7-py3-none-any.whl
          FRONTEND_VERSION: 2026.8.5.dev7
        run: |
          curl --fail --location --retry 3 --output /tmp/abedome_frontend-2026.8.5.dev7-py3-none-any.whl "$FRONTEND_URL"
          echo "$FRONTEND_SHA256  /tmp/abedome_frontend-2026.8.5.dev7-py3-none-any.whl" | sha256sum --check
          python -m pip install --no-deps /tmp/abedome_frontend-2026.8.5.dev7-py3-none-any.whl
          python - <<'PY'
          import os
          from importlib.metadata import version

          import hass_frontend

          assert hass_frontend.where().is_dir()
          assert version("abedome-frontend") == os.environ["FRONTEND_VERSION"]
          PY

      - name: Compile the core source
        run: python -m compileall -q homeassistant

      - name: Verify ABEDOME distribution identity
        run: |
          python - <<'PY'
          from homeassistant.brand import (
              CLI_DESCRIPTION,
              DISTRIBUTION_DISPLAY_NAME,
              DISTRIBUTION_NAME,
              FORK_NOTICE,
              UPSTREAM_PROJECT_NAME,
              UPSTREAM_NAME_USAGE_NOTICE,
          )

          assert DISTRIBUTION_DISPLAY_NAME == "ABEDOME"
          assert DISTRIBUTION_NAME == "ABEDOME OS"
          assert UPSTREAM_PROJECT_NAME == "Home Assistant"
          assert CLI_DESCRIPTION == "ABEDOME OS"
          assert "not affiliated" in FORK_NOTICE
          assert UPSTREAM_NAME_USAGE_NOTICE.startswith('"Home Assistant"')
          PY

      - name: Build Core distribution archives
        run: python -m build

      - name: Verify Core distribution translations
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          required = {
              "homeassistant/components/onboarding/translations/en.json",
              "homeassistant/components/onboarding/translations/it.json",
          }
          wheel = next(Path("dist").glob("*.whl"))
          source = next(Path("dist").glob("*.tar.gz"))
          with zipfile.ZipFile(wheel) as archive:
              wheel_members = set(archive.namelist())
          with tarfile.open(source, "r:gz") as archive:
              source_members = {member.name for member in archive.getmembers()}
          assert required <= wheel_members
          assert all(
              any(member.endswith(f"/{required_file}") for member in source_members)
              for required_file in required
          )
          PY

      - name: Retain the Core distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abedome-core-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 7
