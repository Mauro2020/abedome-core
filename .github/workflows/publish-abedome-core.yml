name: Publish ABEDOME Core
run-name: "Publish ABEDOME Core ${{ inputs.version }}"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable ABEDOME Core development version
        required: true
        default: 2026.9.1.dev7
        type: string

permissions: {}

concurrency:
  group: publish-abedome-core
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the x86-64 ABEDOME Core image
    runs-on: ubuntu-24.04
    permissions:
      contents: read # To check out the repository
      packages: write # To inspect and publish the immutable image in GHCR
    timeout-minutes: 60
    steps:
      - name: Check out ABEDOME Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import pinned upstream backend translations
        env:
          UPSTREAM_TRANSLATIONS_SHA256: 35005ce5491f64e48dfa0ca8436751474b8d8ec346a2406c2e2ba0f40427afcd
          UPSTREAM_TRANSLATIONS_URL: https://files.pythonhosted.org/packages/f9/77/1fa0722a0b8417069844a067a2d16aeaa28b2894f462b37553e421f29bfd/homeassistant-2026.8.1-py3-none-any.whl
        run: |
          set -euo pipefail
          translation_wheel="${RUNNER_TEMP}/homeassistant-2026.8.1-py3-none-any.whl"
          curl --fail --location --retry 3 \
            --output "$translation_wheel" \
            "$UPSTREAM_TRANSLATIONS_URL"
          python3 script/abedome/import_backend_translations.py import \
            --wheel "$translation_wheel" \
            --expected-sha256 "$UPSTREAM_TRANSLATIONS_SHA256" \
            --require-language it

      - name: Validate the immutable product versions
        env:
          EXPECTED_FRONTEND_SHA256: 886fabc0e7d924ce8a7f46a1dd3d624b707a9a17cd21934dc10736945cebd547
          EXPECTED_FRONTEND_VERSION: 2026.8.5.dev7
          EXPECTED_CORE_VERSION: 2026.9.1.dev7
          EXPECTED_IMAGE_VERSION: 2026.9.1.dev7
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          expected_core_version = os.environ["EXPECTED_CORE_VERSION"]
          expected_image_version = os.environ["EXPECTED_IMAGE_VERSION"]
          requested_version = os.environ["REQUESTED_VERSION"]
          assert requested_version == expected_image_version, (
              f"Only {expected_image_version} may be published; received {requested_version}"
          )

          project = tomllib.loads(Path("pyproject.toml").read_text())
          assert project["project"]["version"] == expected_core_version

          tree = ast.parse(Path("homeassistant/const.py").read_text())
          values = {}
          for node in tree.body:
              if (
                  isinstance(node, ast.AnnAssign)
                  and isinstance(node.target, ast.Name)
                  and isinstance(node.value, ast.Constant)
              ):
                  values[node.target.id] = node.value.value
          const_version = (
              f"{values['MAJOR_VERSION']}."
              f"{values['MINOR_VERSION']}."
              f"{values['PATCH_VERSION']}"
          )
          assert const_version == expected_core_version
          assert expected_core_version == expected_image_version

          frontend_version = os.environ["EXPECTED_FRONTEND_VERSION"]
          frontend_sha256 = os.environ["EXPECTED_FRONTEND_SHA256"]
          dependency = next(
              requirement
              for requirement in project["project"]["dependencies"]
              if requirement.startswith("abedome-frontend @ ")
          )
          assert frontend_version in dependency
          assert dependency.endswith(f"#sha256={frontend_sha256}")
          PY

      - name: Verify the published ABEDOME Frontend asset
        env:
          FRONTEND_SHA256: 886fabc0e7d924ce8a7f46a1dd3d624b707a9a17cd21934dc10736945cebd547
          FRONTEND_URL: https://github.com/Mauro2020/abedome-frontend/releases/download/abedome-frontend-2026.8.5.dev7/abedome_frontend-2026.8.5.dev7-py3-none-any.whl
        run: |
          curl --fail --location --retry 3 --output /tmp/abedome_frontend-2026.8.5.dev7-py3-none-any.whl "$FRONTEND_URL"
          echo "$FRONTEND_SHA256  /tmp/abedome_frontend-2026.8.5.dev7-py3-none-any.whl" | sha256sum --check

      - name: Derive the lowercase container image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/abedome-core" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v3.7.1

      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing immutable image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_PACKAGE: abedome-core
          GHCR_TAG: ${{ inputs.version }}
        run: |
          python3 script/abedome/check_ghcr_tag.py \
            --owner "$GHCR_OWNER" \
            --package "$GHCR_PACKAGE" \
            --tag "$GHCR_TAG"

      - name: Build and publish the immutable ABEDOME Core image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.version }}
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/amd64-homeassistant-base:2026.07.0
            BUILD_VERSION=${{ inputs.version }}
            BUILD_REVISION=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Confirm immutable image digest and metadata
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_DIGEST"
          immutable_image="$IMAGE_NAME:$EXPECTED_VERSION"
          immutable_ref="$IMAGE_NAME@$EXPECTED_DIGEST"
          inspection="$(docker buildx imagetools inspect "$immutable_image")"
          printf '%s\n' "$inspection"
          actual_digest="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "$actual_digest"
          if [[ "$actual_digest" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::Published digest $actual_digest does not match build digest $EXPECTED_DIGEST"
            exit 1
          fi

          docker pull "$immutable_ref"
          hass_version="$(docker inspect "$immutable_ref" --format '{{ index .Config.Labels "io.hass.version" }}')"
          image_version="$(docker inspect "$immutable_ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_revision="$(docker inspect "$immutable_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$hass_version" != "$EXPECTED_VERSION" || "$image_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Immutable image version labels do not match $EXPECTED_VERSION"
            exit 1
          fi
          if [[ "$image_revision" != "$EXPECTED_REVISION" ]]; then
            echo "::error::Immutable image revision $image_revision does not match $EXPECTED_REVISION"
            exit 1
          fi
          docker run --rm --entrypoint python3 "$immutable_ref" \
            /usr/src/homeassistant/script/abedome/import_backend_translations.py \
            verify --language en --language it

      - name: Promote verified image to landing-page bootstrap alias
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:landingpage" \
            "$IMAGE_NAME@$EXPECTED_DIGEST"

      - name: Confirm landing-page alias digest and metadata
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          alias_image="$IMAGE_NAME:landingpage"
          inspection="$(docker buildx imagetools inspect "$alias_image")"
          printf '%s\n' "$inspection"
          actual_digest="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "$actual_digest"
          if [[ "$actual_digest" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::Bootstrap alias digest $actual_digest does not match verified digest $EXPECTED_DIGEST"
            exit 1
          fi

          docker pull "$alias_image"
          hass_version="$(docker inspect "$alias_image" --format '{{ index .Config.Labels "io.hass.version" }}')"
          image_version="$(docker inspect "$alias_image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_revision="$(docker inspect "$alias_image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$hass_version" != "$EXPECTED_VERSION" || "$image_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Bootstrap alias version labels do not match $EXPECTED_VERSION"
            exit 1
          fi
          if [[ "$image_revision" != "$EXPECTED_REVISION" ]]; then
            echo "::error::Bootstrap alias revision $image_revision does not match $EXPECTED_REVISION"
            exit 1
          fi

      - name: Summarize the product artifact
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          SOURCE_REVISION: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## ABEDOME Core development image"
            echo
            echo "- Immutable image: \`$IMAGE_NAME:$VERSION\`"
            echo "- Bootstrap alias: \`$IMAGE_NAME:landingpage\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Architecture: \`linux/amd64\`"
            echo "- Core version: \`$VERSION\`"
            echo "- Source revision: \`$SOURCE_REVISION\`"
            echo "- Frontend: \`abedome-frontend==2026.8.5.dev7\`"
            echo
            echo "The bootstrap alias points to the same verified digest as the immutable development image."
            echo "This is a manual development publication; it does not modify stable, beta, or the ABEDOME OS update feed."
          } >> "$GITHUB_STEP_SUMMARY"
