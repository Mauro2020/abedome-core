name: Publish ABEDOME Core
run-name: "Publish ABEDOME Core ${{ inputs.version }}"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      version:
        description: Immutable ABEDOME Core version
        required: true
        default: 2026.11.1
        type: string

permissions: {}

concurrency:
  group: publish-abedome-core
  cancel-in-progress: false

env:
  BASE_IMAGE: ghcr.io/home-assistant/amd64-homeassistant-base:2026.10.3
  CORE_VERSION: "2026.11.1"
  FRONTEND_VERSION: "20261028.5"
  FRONTEND_URL: >-
    https://github.com/Mauro2020/abedome-frontend/releases/download/abedome-frontend-20261028.5/abedome_frontend-20261028.5-py3-none-any.whl
  FRONTEND_SHA256: ${{ vars.ABEDOME_FRONTEND_20261028_5_SHA256 }}
  UPSTREAM_TRANSLATIONS_SHA256: ebe44a05170a170f627cad8a982a81b309519ff301e85f871cc91623e9ce7906
  UPSTREAM_TRANSLATIONS_URL: >-
    https://files.pythonhosted.org/packages/6d/dc/40a9d11b402c9b5d6d07db767c855c41dba976a50655d04b60d7037486ab/homeassistant-2026.11.1-py3-none-any.whl

jobs:
  publish:
    name: Publish the x86-64 ABEDOME Core image
    if: github.ref == 'refs/heads/abedome/develop'
    runs-on: ubuntu-26.04
    permissions:
      contents: read # To check out the repository
      packages: write # To inspect and publish the immutable image in GHCR
    timeout-minutes: 60
    steps:
      - name: Check out ABEDOME Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.14.10
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: ".python-version"
          check-latest: true

      - name: Require the released Frontend digest
        shell: bash
        run: |
          if [[ ! "$FRONTEND_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::Set repository variable ABEDOME_FRONTEND_20261028_5_SHA256 to the released Frontend wheel SHA-256"
            exit 1
          fi

      - name: Import pinned upstream backend translations
        run: |
          set -euo pipefail
          translation_wheel="${RUNNER_TEMP}/homeassistant-${CORE_VERSION}-py3-none-any.whl"
          curl --fail --location --retry 3 \
            --output "$translation_wheel" \
            "$UPSTREAM_TRANSLATIONS_URL"
          python3 script/abedome/import_backend_translations.py import \
            --wheel "$translation_wheel" \
            --expected-sha256 "$UPSTREAM_TRANSLATIONS_SHA256" \
            --require-language it

      - name: Validate the immutable product versions
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import ast
          import os
          from pathlib import Path
          import tomllib

          expected_core_version = os.environ["CORE_VERSION"]
          requested_version = os.environ["REQUESTED_VERSION"]
          assert requested_version == expected_core_version, (
              f"Only {expected_core_version} may be published; received {requested_version}"
          )

          project = tomllib.loads(Path("pyproject.toml").read_text())
          assert project["project"]["version"] == expected_core_version

          tree = ast.parse(Path("homeassistant/const.py").read_text())
          values = {}
          for node in tree.body:
              if (
                  isinstance(node, ast.AnnAssign)
                  and isinstance(node.target, ast.Name)
                  and isinstance(node.value, ast.Constant)
              ):
                  values[node.target.id] = node.value.value
          const_version = (
              f"{values['MAJOR_VERSION']}."
              f"{values['MINOR_VERSION']}."
              f"{values['PATCH_VERSION']}"
          )
          assert const_version == expected_core_version

          frontend_version = os.environ["FRONTEND_VERSION"]
          frontend_sha256 = os.environ["FRONTEND_SHA256"]
          dependency = next(
              requirement
              for requirement in project["project"]["dependencies"]
              if requirement.startswith("abedome-frontend @ ")
          )
          expected_frontend_dependency = (
              f"abedome-frontend @ {os.environ['FRONTEND_URL']}"
              f"#sha256={frontend_sha256}"
          )
          assert frontend_version in expected_frontend_dependency
          assert dependency == expected_frontend_dependency
          PY

      - name: Verify the published ABEDOME Frontend asset
        run: |
          set -euo pipefail
          frontend_wheel="${RUNNER_TEMP}/abedome_frontend-${FRONTEND_VERSION}-py3-none-any.whl"
          curl --fail --location --retry 3 --output "$frontend_wheel" "$FRONTEND_URL"
          echo "$FRONTEND_SHA256  $frontend_wheel" | sha256sum --check

      - name: Derive the lowercase container image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/abedome-core" >> "$GITHUB_OUTPUT"
          echo "candidate_tag=candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify the signed upstream base image
        id: base
        shell: bash
        run: |
          set -euo pipefail
          verification="$(cosign verify --output json \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp https://github.com/home-assistant/docker/.* \
            "$BASE_IMAGE")"
          printf '%s\n' "$verification"
          digest="$(jq -er '.[0].critical.image["docker-manifest-digest"]' <<< "$verification")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Cosign did not return a valid base image digest"
            exit 1
          fi
          echo "ref=$BASE_IMAGE@$digest" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse an existing immutable image tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_OWNER: ${{ github.repository_owner }}
          GHCR_PACKAGE: abedome-core
          GHCR_TAG: ${{ inputs.version }}
        run: |
          python3 script/abedome/check_ghcr_tag.py \
            --owner "$GHCR_OWNER" \
            --package "$GHCR_PACKAGE" \
            --tag "$GHCR_TAG"

      - name: Build and publish the uniquely tagged candidate image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ steps.image.outputs.candidate_tag }}
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.ref }}
            BUILD_VERSION=${{ inputs.version }}
            BUILD_REVISION=${{ github.sha }}
          provenance: true
          sbom: true

      - name: Verify candidate digest, metadata, translations, and Frontend
        env:
          CANDIDATE_TAG: ${{ steps.image.outputs.candidate_tag }}
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_DIGEST"
          candidate_image="$IMAGE_NAME:$CANDIDATE_TAG"
          candidate_ref="$IMAGE_NAME@$EXPECTED_DIGEST"
          inspection="$(docker buildx imagetools inspect "$candidate_image")"
          printf '%s\n' "$inspection"
          actual_digest="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" {print $2; exit}')"
          test -n "$actual_digest"
          if [[ "$actual_digest" != "$EXPECTED_DIGEST" ]]; then
            echo "::error::Candidate digest $actual_digest does not match build digest $EXPECTED_DIGEST"
            exit 1
          fi

          docker pull "$candidate_ref"
          hass_version="$(docker inspect "$candidate_ref" --format '{{ index .Config.Labels "io.hass.version" }}')"
          image_version="$(docker inspect "$candidate_ref" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
          image_revision="$(docker inspect "$candidate_ref" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
          if [[ "$hass_version" != "$EXPECTED_VERSION" || "$image_version" != "$EXPECTED_VERSION" ]]; then
            echo "::error::Candidate image version labels do not match $EXPECTED_VERSION"
            exit 1
          fi
          if [[ "$image_revision" != "$EXPECTED_REVISION" ]]; then
            echo "::error::Candidate image revision $image_revision does not match $EXPECTED_REVISION"
            exit 1
          fi
          docker run --rm --entrypoint python3 "$candidate_ref" \
            /usr/src/homeassistant/script/abedome/import_backend_translations.py \
            verify --language en --language it

          docker run --rm -i \
            -e FRONTEND_VERSION \
            --entrypoint python3 \
            "$candidate_ref" - <<'PY'
          import json
          import os
          from importlib.metadata import PackageNotFoundError, version
          from pathlib import Path

          expected = os.environ["FRONTEND_VERSION"]
          assert version("abedome-frontend") == expected
          try:
              version("home-assistant-frontend")
          except PackageNotFoundError:
              pass
          else:
              raise AssertionError("upstream Frontend distribution is installed")

          manifest = json.loads(
              Path(
                  "/usr/src/homeassistant/homeassistant/components/frontend/manifest.json"
              ).read_text()
          )
          assert manifest["requirements"] == [f"abedome-frontend=={expected}"]
          PY

      - name: Promote verified digest to immutable version and bootstrap alias
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_VERSION: ${{ inputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "$IMAGE_NAME:$EXPECTED_VERSION" \
            --tag "$IMAGE_NAME:landingpage" \
            "$IMAGE_NAME@$EXPECTED_DIGEST"

      - name: Confirm immutable version and landing-page alias
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ inputs.version }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          set -euo pipefail
          for tag in "$EXPECTED_VERSION" landingpage; do
            image="$IMAGE_NAME:$tag"
            inspection="$(docker buildx imagetools inspect "$image")"
            printf '%s\n' "$inspection"
            actual_digest="$(printf '%s\n' "$inspection" | awk '$1 == "Digest:" {print $2; exit}')"
            test -n "$actual_digest"
            if [[ "$actual_digest" != "$EXPECTED_DIGEST" ]]; then
              echo "::error::$tag digest $actual_digest does not match verified digest $EXPECTED_DIGEST"
              exit 1
            fi

            docker pull "$image"
            hass_version="$(docker inspect "$image" --format '{{ index .Config.Labels "io.hass.version" }}')"
            image_version="$(docker inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')"
            image_revision="$(docker inspect "$image" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            if [[ "$hass_version" != "$EXPECTED_VERSION" || "$image_version" != "$EXPECTED_VERSION" ]]; then
              echo "::error::$tag version labels do not match $EXPECTED_VERSION"
              exit 1
            fi
            if [[ "$image_revision" != "$EXPECTED_REVISION" ]]; then
              echo "::error::$tag revision $image_revision does not match $EXPECTED_REVISION"
              exit 1
            fi
          done

      - name: Summarize the product artifact
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          SOURCE_REVISION: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## ABEDOME Core image"
            echo
            echo "- Immutable image: \`$IMAGE_NAME:$VERSION\`"
            echo "- Bootstrap alias: \`$IMAGE_NAME:landingpage\`"
            echo "- Digest: \`$DIGEST\`"
            echo "- Architecture: \`linux/amd64\`"
            echo "- Core version: \`$VERSION\`"
            echo "- Source revision: \`$SOURCE_REVISION\`"
            echo "- Frontend: \`abedome-frontend==$FRONTEND_VERSION\`"
            echo
            echo "The bootstrap alias points to the same verified digest as the immutable image."
            echo "This manual publication does not modify the ABEDOME OS update feed."
          } >> "$GITHUB_STEP_SUMMARY"
